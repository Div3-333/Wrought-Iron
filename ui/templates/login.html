{% extends "base.html" %}

{% block content %}
<div class="container-fluid d-flex justify-content-center align-items-center vh-100">
    <div class="glass-card p-5 animate__animated animate__fadeInUp" style="max-width: 450px; width: 100%;">
        <div class="text-center mb-4">
            <i class="fas fa-leaf fa-3x text-gradient-primary"></i>
            <h2 class="mt-3 font-heading">Welcome Back</h2>
            <p class="text-muted">Sign in to access the Wrought Iron dashboard.</p>
        </div>

        {% if form.errors %}
            <div class="alert alert-danger" role="alert">
                Your username and password didn't match. Please try again.
            </div>
        {% endif %}

        <form method="post">
            {% csrf_token %}
            <div class="form-floating mb-3">
                <input type="text" class="form-control" name="username" id="username" placeholder="Username" required>
                <label for="username">Username</label>
            </div>
            <div class="form-floating mb-4">
                <input type="password" class="form-control" name="password" id="password" placeholder="Password" required>
                <label for="password">Password</label>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary btn-lg shadow-lg">
                    <i class="fas fa-sign-in-alt me-2"></i>Log In
                </button>
            </div>
        </form>
        <div class="text-center mt-4">
            <p class="text-muted small">
                Don't have an account? Please contact an administrator.
            </p>
        </div>
    </div>
</div>
{% endblock %}
