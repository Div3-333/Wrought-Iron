<!-- File Browser Modal -->
<div class="modal fade" id="fileBrowserModal" tabindex="-1" aria-labelledby="fileBrowserLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content glass-card border-0">
            <div class="modal-header border-bottom-0">
                <h5 class="modal-title fw-bold" id="fileBrowserLabel">Select File</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body p-0">
                <div class="px-3 pb-2 border-bottom">
                    <div class="input-group input-group-sm">
                        <span class="input-group-text bg-light border-0"><i class="fas fa-folder"></i></span>
                        <input type="text" id="currentPath" class="form-control border-0 bg-light" readonly>
                    </div>
                </div>
                
                <div class="list-group list-group-flush scrollable-y" id="fileList" style="height: 400px;">
                    <!-- Files will be loaded here via JS -->
                    <div class="text-center p-5 text-muted">
                        <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                        <div>Loading files...</div>
                    </div>
                </div>
            </div>
            <div class="modal-footer border-top-0">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
            </div>
        </div>
    </div>
</div>

<script>
    let targetInputId = null;
    let currentBrowserPath = '.';

    function openFileBrowser(inputId) {
        targetInputId = inputId;
        const modal = new bootstrap.Modal(document.getElementById('fileBrowserModal'));
        loadFiles(currentBrowserPath);
        modal.show();
    }

    function loadFiles(path) {
        const list = document.getElementById('fileList');
        const pathInput = document.getElementById('currentPath');
        
        list.innerHTML = `
            <div class="text-center p-5 text-muted">
                <div class="spinner-border spinner-border-sm text-primary mb-2" role="status"></div>
                <div>Loading...</div>
            </div>`;
            
        fetch(`/api/files/?path=${encodeURIComponent(path)}`)
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    list.innerHTML = `<div class="p-3 text-danger"><i class="fas fa-exclamation-circle me-2"></i>${data.error}</div>`;
                    return;
                }
                
                pathInput.value = data.current_path;
                currentBrowserPath = data.current_path; // Update state
                list.innerHTML = ''; // Clear loading
                
                data.items.forEach(item => {
                    const el = document.createElement('a');
                    el.className = 'list-group-item list-group-item-action d-flex align-items-center py-2 px-3';
                    el.href = '#';
                    
                    let icon = 'fa-file text-muted';
                    let colorClass = 'text-dark';
                    
                    if (item.type === 'dir') {
                        icon = 'fa-folder text-warning';
                        if (item.name === '..') {
                            icon = 'fa-level-up-alt text-secondary';
                        }
                    } else {
                        // Simple extension icons
                        if (item.name.endsWith('.db') || item.name.endsWith('.sqlite')) icon = 'fa-database text-success';
                        else if (item.name.endsWith('.csv')) icon = 'fa-table text-info';
                        else if (item.name.endsWith('.json')) icon = 'fa-code text-warning';
                        else if (item.name.endsWith('.py')) icon = 'fa-python text-primary';
                        else if (item.name.endsWith('.html')) icon = 'fa-html5 text-danger';
                    }
                    
                    el.innerHTML = `
                        <div class="me-3" style="width: 20px; text-align: center;"><i class="fas ${icon}"></i></div>
                        <div class="flex-grow-1 text-truncate ${colorClass}">${item.name}</div>
                        ${item.type === 'dir' ? '<i class="fas fa-chevron-right small text-muted opacity-25"></i>' : ''}
                    `;
                    
                    el.onclick = (e) => {
                        e.preventDefault();
                        if (item.type === 'dir') {
                            loadFiles(item.path);
                        } else {
                            selectFile(item.path);
                        }
                    };
                    
                    list.appendChild(el);
                });
            })
            .catch(err => {
                list.innerHTML = `<div class="p-3 text-danger">Network Error: ${err}</div>`;
            });
    }

    function selectFile(path) {
        if (targetInputId) {
            // Convert absolute path to relative if inside project for cleaner look (optional)
            // For now, absolute path is safer for CLI
            document.getElementById(targetInputId).value = path;
        }
        const modalEl = document.getElementById('fileBrowserModal');
        const modal = bootstrap.Modal.getInstance(modalEl);
        modal.hide();
    }
</script>
