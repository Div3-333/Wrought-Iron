{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <h2 class="mb-4">Data Explorer</h2>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <div class="row">
        {% for table in tables %}
        <div class="col-md-4 col-lg-3 mb-4">
            <div class="card h-100 text-center hover-card">
                <div class="card-body d-flex flex-column justify-content-center align-items-center">
                    <div class="mb-3 rounded-circle bg-dark d-flex align-items-center justify-content-center" style="width: 60px; height: 60px;">
                        <i class="fas fa-table fa-2x text-primary"></i>
                    </div>
                    <h5 class="card-title">{{ table }}</h5>
                    <a href="{% url 'table_detail' table %}" class="btn btn-outline-primary mt-3 stretched-link">View Data</a>
                </div>
            </div>
        </div>
        {% empty %}
        <div class="col-12">
            <div class="alert alert-info">No tables found in the active database.</div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
