[package]
name = "wrought_iron_core"
version = "0.1.0"
edition = "2021"

[lib]
name = "wrought_iron_core"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.23", features = ["extension-module"] }
rayon = "1.8"
strsim = "0.10"
regex = "1.10"
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.21"
rand = "0.8"
aes = "0.8"
cbc = "0.1"
block-padding = "0.3"
hex = "0.4"
hmac = "0.12"
# For geo
geo = "0.27"
rstar = "0.11"
generic-array = "0.14"
